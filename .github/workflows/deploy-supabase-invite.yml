name: Deploy Supabase staff invitation function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out security upgrade branch
        uses: actions/checkout@v4
        with:
          ref: security-auth-upgrade

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate staging deployment settings
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_PROJECT_ID. Set it to the separate STAGING project ref, never the production project."
            exit 1
          fi
          if [ "$SUPABASE_PROJECT_ID" = "dsznwcwuypyjrndjaicw" ]; then
            echo "::error::Blocked: this is the known PRODUCTION project. Deployment is not permitted."
            exit 1
          fi

      - name: Deploy admin invitation function to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase functions deploy admin-invite-staff --project-ref "$SUPABASE_PROJECT_ID"
