name: Deploy Supabase staff invitation function (staging only)

on:
  push:
    branches:
      - security-auth-upgrade

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out security upgrade branch
        uses: actions/checkout@v4
        with:
          ref: security-auth-upgrade

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate staging-only target
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          STAGING_PROJECT_ID="lxrcivgjkvzasjgqvhxh"
          PRODUCTION_PROJECT_ID="dsznwcwuypyjrndjaicw"
          if [ "$STAGING_PROJECT_ID" = "$PRODUCTION_PROJECT_ID" ]; then
            echo "::error::Safety check failed: staging target equals production."
            exit 1
          fi
          echo "Validated staging project target: $STAGING_PROJECT_ID"

      - name: Deploy admin invitation function to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy admin-invite-staff --project-ref lxrcivgjkvzasjgqvhxh

# Credential rotation verification trigger: 2026-10-31
