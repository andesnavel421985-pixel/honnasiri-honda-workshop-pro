name: Validate workshop security branch

on:
  pull_request:
    branches: [main]
  push:
    branches: [security-auth-upgrade]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax and HTML structure
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess, tempfile

          html = Path("index.html").read_text(encoding="utf-8")
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.duplicates = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      value = attrs["id"]
                      if value in self.ids:
                          self.duplicates.append(value)
                      self.ids.append(value)
          parser = Check()
          parser.feed(html)
          if parser.duplicates:
              raise SystemExit("Duplicate HTML IDs: " + ", ".join(sorted(set(parser.duplicates))))
          if not re.search(r'<script type="module">', html):
              raise SystemExit("Supabase authentication module script missing")
          scripts = re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>', html)
          for i, script in enumerate(scripts):
              if not script.strip():
                  continue
              path = Path(tempfile.gettempdir()) / f"inline-{i}.js"
              path.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          print(f"HTML parsed; {len(parser.ids)} unique IDs; inline scripts pass syntax checks.")
          PY
          node --check src/auth/supabase-auth.js
      - name: Verify security migration invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sql = Path("supabase/migrations/0003_lock_staff_profile_writes.sql").read_text().lower()
          required = [
              "revoke insert, update, delete on table public.staff_profiles",
              "grant select on table public.staff_profiles to authenticated",
              "revoke all on function public.admin_set_staff_access(uuid,text,text,boolean)",
              "grant execute on function public.admin_set_staff_access(uuid,text,text,boolean) to authenticated",
          ]
          missing = [item for item in required if item not in sql]
          if missing:
              raise SystemExit("Missing security migration invariant(s): " + "; ".join(missing))
          print("Staff-profile privilege hardening checks passed.")
          PY
